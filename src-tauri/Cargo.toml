[package]
name = "bili-danmu"
version = "1.6.0"
description = "轻量级 B 站直播弹幕助手"
license = "GPL-3.0"
edition = "2021"

[lib]
name = "bili_danmu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", features = ["json", "gzip"] }
md-5 = "0.10"
sha2 = "0.10"
futures-util = "0.3"
brotli-decompressor = "4"
flate2 = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Media_Multimedia", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 锁 2.12.x：上游 2.13+ 要求 tauri ^2.12，而本机 tauri 还停在 2.11.5
# （升 tauri 会连带换掉 wry / tao，透明悬浮窗最脆，单独一个 PR 再动）
#
# 关掉默认的 rustls-tls / zip：rustls 会内嵌一整套根证书（二进制 +3MB），而项目
# 其它网络代码走的就是 native-tls（系统证书库，跟系统的代理与证书设置一致）；
# zip 只在解 Tauri v1 风格的 .zip 更新包时用得到，我们只发 NSIS .exe
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls", "system-proxy"] }

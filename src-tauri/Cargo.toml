[package]
name = "bili-danmu"
version = "0.1.0"
description = "轻量级 B 站直播弹幕桌面 Overlay 客户端"
edition = "2021"

[lib]
name = "bili_danmu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
